summary:
  pt: Desenvolvi do zero e de ponta a ponta um assistente de IA para apoiar operadores de onboarding bancário na consulta de regras de negócio, documentação e dados. A aplicação entrou em produção e começou a ser utilizada pela equipe.
  en: Developed an AI assistant from scratch, end to end, to help banking onboarding operators consult business rules, documentation and data. The application went live and the team began using it.
  es: Desarrollé desde cero y de principio a fin un asistente de IA para ayudar a los operadores de onboarding bancario a consultar reglas de negocio, documentación y datos. La aplicación se puso en producción y el equipo comenzó a utilizarla.
highlights:
  pt:
    - Implementei busca inteligente na documentação com RAG e consultas em linguagem natural a PostgreSQL e MySQL, com indicação de fontes e acesso somente leitura aos dados.
    - Desenvolvi o backend em Python/FastAPI e o frontend em React/TypeScript, com chat, histórico, feedback e painéis administrativos.
    - Preparei a entrega com Docker, Kubernetes e Azure DevOps, com observabilidade no Datadog, controles de custo de IA e avaliações automatizadas da qualidade das respostas.
  en:
    - Implemented intelligent document search with RAG and natural-language queries to PostgreSQL and MySQL, with source references and read-only data access.
    - Developed the Python/FastAPI backend and React/TypeScript frontend, including chat, conversation history, feedback and administrative dashboards.
    - Prepared application delivery with Docker, Kubernetes and Azure DevOps, with Datadog observability, AI usage and cost controls and automated AI response evaluations.
  es:
    - Implementé búsqueda inteligente en la documentación con RAG y consultas en lenguaje natural a PostgreSQL y MySQL, con referencias a las fuentes y acceso de solo lectura a los datos.
    - Desarrollé el backend en Python/FastAPI y el frontend en React/TypeScript, con chat, historial, feedback y paneles administrativos.
    - Preparé el despliegue con Docker, Kubernetes y Azure DevOps, con observabilidad en Datadog, controles de consumo y costos de IA y evaluaciones automatizadas de las respuestas.
stack:
