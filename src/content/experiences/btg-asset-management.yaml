  es:
    - Integré datos de dos sistemas, traté inconsistencias e identifiqué inmuebles correspondientes entre las bases usando información como precio y área.
    - Desarrollé reglas de negocio y un sistema de puntuación para señalar oportunidades, variaciones de precio, inmuebles presentes en varias bases y cambios de estado.
    - Contribuí a un dashboard con filtros, mapas y comparación de precio por pie cuadrado para el análisis regional de los inmuebles.
