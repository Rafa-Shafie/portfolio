summary:
  pt: Na Coordenação de Tecnologia, desenvolvi em equipe um software de gestão em Node.js e TypeScript, do levantamento de requisitos à entrega.
  en: In the Technology Coordination team, developed a management application in Node.js and TypeScript, from requirements gathering to delivery.
  es: En la Coordinación de Tecnología, desarrollé en equipo un software de gestión en Node.js y TypeScript, desde la recopilación de requisitos hasta la entrega.
highlights:
  pt:
    - Realizei visitas técnicas e entrevistei funcionários de uma fábrica alimentícia para levantar requisitos e mapear processos; participei da remodelagem dos dados e do desenho do fluxo de um novo sistema para a fábrica.
    - Apoiei rotinas de contas a pagar e conciliação bancária na Diretoria Administrativo-Financeira.
    - Conduzi entrevistas e dinâmicas no processo seletivo e orientei novos trainees.
  en:
    - Visited a food factory and interviewed employees to gather requirements and map processes; helped redesign its data model and the new system's data flow.
    - Supported accounts payable and bank reconciliation in the Administration and Finance department.
    - Conducted interviews and group exercises during recruiting and mentored new trainees.
  es:
    - Realicé visitas técnicas y entrevisté a empleados de una fábrica de alimentos para recopilar requisitos y mapear procesos; participé en el rediseño del modelo de datos y del flujo de un nuevo sistema para la fábrica.
    - Apoyé las tareas de cuentas por pagar y conciliación bancaria en la Dirección Administrativa y Financiera.
    - Realicé entrevistas y dinámicas de grupo en el proceso de selección y orienté a los nuevos trainees.
outcome:
  pt: "Um software de gestão levado do levantamento de requisitos até a entrega, em equipe."
  en: "A management application taken from requirements gathering to delivery, as a team."
  es: "Un software de gestión llevado desde la recopilación de requisitos hasta la entrega, en equipo."
stack:
  - Node.js
  - TypeScript
  - Prisma
  - SQLite
  - Git
  - Scrum
  - Kanban

