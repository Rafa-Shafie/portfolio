    - Visited a food factory and interviewed employees to gather requirements and map processes; helped redesign its data model and the new system's data flow.
    - Supported accounts payable and bank reconciliation in the Administration and Finance department.
    - Conducted interviews and group exercises during recruiting and mentored new trainees.
  es:
    - Realicé visitas técnicas y entrevisté a empleados de una fábrica de alimentos para recopilar requisitos y mapear procesos; participé en el rediseño del modelo de datos y del flujo de un nuevo sistema para la fábrica.
    - Apoyé las tareas de cuentas por pagar y conciliación bancaria en la Dirección Administrativa y Financiera.
    - Realicé entrevistas y dinámicas de grupo en el proceso de selección y orienté a los nuevos trainees.
