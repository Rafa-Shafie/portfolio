    items: [{ pt: "Módulos", en: "Modules", es: "Módulos" }, "Controllers", "Services", "DTOs"]
  - label: { pt: "Persistência", en: "Persistence", es: "Persistencia" }
    items: ["PostgreSQL", "SQL", "Prisma", "Migrations"]
