description:
  pt: "Gestor financeiro doméstico mobile-first que importa os extratos de cada membro da casa, categoriza com IA e concilia as transferências internas para eliminar a dupla contagem."
  en: "A mobile-first household finance manager that imports each family member's bank statements, categorizes them with AI and reconciles internal transfers to avoid double counting."
  es: "Gestor financiero doméstico mobile-first que importa los extractos de cada miembro de la casa, los categoriza con IA y concilia las transferencias internas para eliminar el doble conteo."
