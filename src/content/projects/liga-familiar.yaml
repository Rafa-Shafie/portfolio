# Liga Familiar Gamificada: exercício de aprendizado declarado (decisão de 10/11/2026, ADR-007 e
# ADR-012). Postgres com volume e event sourcing medido contra SQL direto. Repositório público.
# Status honesto: só a infraestrutura (fatia 0) e as decisões de arquitetura (ADRs) existem; não há
# código de domínio nem nenhuma medição. As metas são metas, não resultados. Sem demo, sem hospedagem
# e sem usuários reais; sem link para os ADRs (ficam no repositório).
# Privacidade: sem os nomes dos membros da família.
title:
  pt: "Liga Familiar Gamificada"
  en: "Liga Familiar Gamificada"
  es: "Liga Familiar Gamificada"
description:
  pt: "Exercício de aprendizado para medir antes de otimizar e modelar estado como eventos: um gerenciador de tarefas domésticas serve de pretexto para estudar Postgres com milhões de eventos e comparar event sourcing com SQL direto."
  en: "A learning exercise in measuring before optimizing and modeling state as events: a household chore manager is the pretext to study Postgres with millions of events and compare event sourcing with plain SQL."
  es: "Ejercicio de aprendizaje para medir antes de optimizar y modelar el estado como eventos: un gestor de tareas domésticas sirve de pretexto para estudiar Postgres con millones de eventos y comparar event sourcing con SQL directo."
