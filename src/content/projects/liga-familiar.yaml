  pt: "Infraestrutura e decisões de arquitetura concluídas · implementação do domínio ainda não começou"
  en: "Infrastructure and architecture decisions done · domain implementation not started yet"
  es: "Infraestructura y decisiones de arquitectura concluidas · la implementación del dominio aún no empezó"
