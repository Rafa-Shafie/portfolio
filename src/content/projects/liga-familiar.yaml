details:
  intro:
    pt: "Um exercício de aprendizado declarado, não um produto para a família usar. As tarefas com pontos são só o pretexto: num razão de pontos, uma tabela append-only com SUM já resolve o placar. Mesmo assim, a Liga vai implementar event sourcing completo e medir o custo contra o SQL direto, e o relatório final vai dizer quando cada forma compensa. Se o SQL vencer em tudo, esse é o resultado."
    en: "A declared learning exercise, not a product for my family to use. Chores worth points are only the pretext: in a points ledger, an append-only table with SUM already solves the scoreboard. Even so, Liga will implement full event sourcing and measure its cost against plain SQL, and the final report will say when each approach pays off. If SQL wins everywhere, that is the result."
    es: "Un ejercicio de aprendizaje declarado, no un producto para que lo use mi familia. Las tareas con puntos son solo el pretexto: en un libro de puntos, una tabla append-only con SUM ya resuelve el marcador. Aun así, la Liga va a implementar event sourcing completo y medir su costo frente al SQL directo, y el informe final va a decir cuándo compensa cada forma. Si el SQL gana en todo, ese es el resultado."
  sections:
    - heading: { pt: "Como é construído", en: "How it is built", es: "Cómo se construye" }
      text:
        pt: "Duas frentes de estudo: desempenho de consulta com volume, medido antes e depois de cada técnica, e event sourcing com projeções reconstruíveis. O modelo já está decidido: uma tabela única de eventos, com colunas tipadas e JSONB, para TarefaConcluida, PenalidadeAplicada e ConclusaoEstornada, com o estorno vinculado ao evento original. Cada evento terá duas linhas do tempo, quando aconteceu e quando o sistema soube; o replay segue a ordem do id, e os horários são convertidos para America/Sao_Paulo na consulta. De propósito, nenhuma regra depende de saldo. Não há login, hospedagem nem usuários reais: as famílias existem como dados. A tela será mínima e gerada com o Claude Code, porque o foco é back-end e dados. O desenvolvimento avança em fatias verticais, e cada decisão de arquitetura fica registrada em um ADR (Architecture Decision Record)."
        en: "Two lines of study: query performance at volume, measured before and after each technique, and event sourcing with rebuildable projections. The model is already decided: a single events table, with typed columns and JSONB, for TarefaConcluida, PenalidadeAplicada and ConclusaoEstornada, with each reversal linked to the original event. Every event will have two timelines, when it happened and when the system learned about it; replay follows the id order, and timestamps are converted to America/Sao_Paulo at query time. On purpose, no rule depends on a balance. There is no login, hosting or real users: families exist as data. The UI will be minimal and generated with Claude Code, because the focus is backend and data. Development moves in vertical slices, and every architecture decision is recorded in an ADR (Architecture Decision Record)."
        es: "Dos frentes de estudio: rendimiento de consultas con volumen, medido antes y después de cada técnica, y event sourcing con proyecciones reconstruibles. El modelo ya está decidido: una tabla única de eventos, con columnas tipadas y JSONB, para TarefaConcluida, PenalidadeAplicada y ConclusaoEstornada, con la reversión vinculada al evento original. Cada evento tendrá dos líneas de tiempo, cuándo ocurrió y cuándo lo supo el sistema; el replay sigue el orden del id, y los horarios se convierten a America/Sao_Paulo en la consulta. A propósito, ninguna regla depende de un saldo. No hay login, hosting ni usuarios reales: las familias existen como datos. La pantalla será mínima y generada con Claude Code, porque el foco es el backend y los datos. El desarrollo avanza en vertical slices, y cada decisión de arquitectura queda registrada en un ADR (Architecture Decision Record)."
    - heading: { pt: "Já implementado", en: "Already built", es: "Ya implementado" }
      items:
        pt:
          - "Ambiente reproduzível com Docker Compose: PostgreSQL 18 com versão fixada, volume persistente e healthcheck."
          - "Spring Boot 4 conectado ao banco, com o Flyway como único dono do schema; o Hibernate só valida o mapeamento."
          - "Configuração e segredos fora do código."
          - "12 ADRs, incluindo os que registram as mudanças de escopo e a justificativa do event sourcing."
        en:
          - "A reproducible environment with Docker Compose: PostgreSQL 18 with a pinned version, a persistent volume and a healthcheck."
          - "Spring Boot 4 connected to the database, with Flyway as the single owner of the schema; Hibernate only validates the mapping."
          - "Configuration and secrets kept out of the code."
          - "12 ADRs, including the ones that record the scope changes and the rationale for event sourcing."
        es:
          - "Entorno reproducible con Docker Compose: PostgreSQL 18 con versión fijada, volumen persistente y healthcheck."
          - "Spring Boot 4 conectado a la base de datos, con Flyway como único dueño del schema; Hibernate solo valida el mapeo."
          - "Configuración y secretos fuera del código."
          - "12 ADRs, incluidos los que registran los cambios de alcance y la justificación del event sourcing."
    - heading: { pt: "Planejado (ainda não implementado)", en: "Planned (not built yet)", es: "Planificado (todavía no implementado)" }
      items:
        pt:
          - "Registrar uma conclusão como evento e cadastrar famílias, membros e tarefas, com API, tela mínima, testes de integração com Testcontainers e PostgreSQL real (sem H2) e CI no GitHub Actions."
          - "Penalidade e estorno, com um índice único no banco que recusa estorno duplicado, e o placar reconstruído por replay."
          - "Gerador de dados sintéticos com semente fixa e registros tardios: 2 anos de eventos, com 100 mil, 1 milhão e 10 milhões."
          - "Baseline de 8 consultas fixas (placar da semana, ranking com RANK, série mensal, maior sequência de dias seguidos, total do ano, top 10 famílias, eficiência por família e placar numa data passada com o que se sabia nela), com EXPLAIN (ANALYZE, BUFFERS), 30 execuções, p50 e p95, cache frio e quente e relatórios versionados."
          - "Índices, rollups e view materializada, snapshots e versionamento de eventos, com um relatório final que compara cinco formas de calcular o mesmo placar: SQL direto, projeção incremental, replay completo, rollup e replay a partir de snapshot."
          - "Provas do lado event sourcing: projeção incremental idêntica ao replay, replay determinístico, banco recusando UPDATE e DELETE e eventos v1 legíveis depois de mudar o formato."
          - "Opcionais, ao final: particionamento por mês e detecção de trapaça."
          - "Metas, não resultados: p95 abaixo de 100 ms por família com 10 milhões de eventos e ganho de 10x por técnica, ou a explicação de por que não veio."
        en:
          - "Recording a completion as an event and registering families, members and chores, with an API, a minimal UI, integration tests with Testcontainers and a real PostgreSQL (no H2), and CI on GitHub Actions."
          - "Penalties and reversals, with a unique index in the database that rejects duplicate reversals, and the scoreboard rebuilt by replay."
          - "A synthetic data generator with a fixed seed and late-arriving records: 2 years of events, at 100 thousand, 1 million and 10 million."
          - "A baseline of 8 fixed queries (weekly scoreboard, ranking with RANK, monthly series, longest streak of consecutive days, yearly total, top 10 families, efficiency per family and the scoreboard on a past date as it was known then), with EXPLAIN (ANALYZE, BUFFERS), 30 runs, p50 and p95, cold and warm cache, and versioned reports."
          - "Indexes, rollups and a materialized view, snapshots and event versioning, with a final report comparing five ways to calculate the same scoreboard: plain SQL, incremental projection, full replay, rollup and replay from a snapshot."
          - "Event sourcing proofs: incremental projection identical to the replay, deterministic replay, the database rejecting UPDATE and DELETE, and v1 events still readable after the format changes."
          - "Optional, at the end: monthly partitioning and cheating detection."
          - "Targets, not results: p95 below 100 ms per family with 10 million events and a 10x gain per technique, or an explanation of why it did not come."
        es:
          - "Registrar una tarea completada como evento y dar de alta familias, miembros y tareas, con API, pantalla mínima, pruebas de integración con Testcontainers y PostgreSQL real (sin H2) y CI en GitHub Actions."
          - "Penalización y reversión, con un índice único en la base de datos que rechaza reversiones duplicadas, y el marcador reconstruido por replay."
          - "Generador de datos sintéticos con semilla fija y registros tardíos: 2 años de eventos, con 100 mil, 1 millón y 10 millones."
          - "Baseline de 8 consultas fijas (marcador de la semana, ranking con RANK, serie mensual, racha más larga de días seguidos, total del año, top 10 familias, eficiencia por familia y marcador en una fecha pasada con lo que se sabía entonces), con EXPLAIN (ANALYZE, BUFFERS), 30 ejecuciones, p50 y p95, caché fría y caliente e informes versionados."
          - "Índices, rollups y vista materializada, snapshots y versionado de eventos, con un informe final que compara cinco formas de calcular el mismo marcador: SQL directo, proyección incremental, replay completo, rollup y replay a partir de un snapshot."
          - "Pruebas del lado de event sourcing: proyección incremental idéntica al replay, replay determinista, base de datos que rechaza UPDATE y DELETE y eventos v1 legibles después de cambiar el formato."
          - "Opcionales, al final: particionamiento por mes y detección de trampas."
          - "Metas, no resultados: p95 por debajo de 100 ms por familia con 10 millones de eventos y una ganancia de 10x por técnica, o la explicación de por qué no llegó."
    - heading: { pt: "Desafio até aqui", en: "Challenge so far", es: "Desafío hasta ahora" }
      text:
        pt: "A pergunta que guia o projeto: num razão de pontos, uma tabela append-only com SUM resolve, então por que gravar eventos e derivar o placar, e o que se ganha e se perde? Em vez de defender uma resposta, decidi medi-la (ADR-012). Antes disso, o escopo mudou antes de existir código de domínio: o produto multi-família com login foi descartado para focar no que meus outros projetos não cobrem (ADR-007)."
        en: "The question that drives the project: in a points ledger, an append-only table with SUM is enough, so why store events and derive the scoreboard, and what do you gain and lose? Instead of defending an answer, I decided to measure it (ADR-012). Before that, the scope changed before any domain code existed: the multi-family product with login was dropped to focus on what my other projects do not cover (ADR-007)."
        es: "La pregunta que guía el proyecto: en un libro de puntos, una tabla append-only con SUM es suficiente, entonces ¿por qué guardar eventos y derivar el marcador, y qué se gana y qué se pierde? En lugar de defender una respuesta, decidí medirla (ADR-012). Antes de eso, el alcance cambió antes de que existiera código de dominio: el producto multifamilia con login se descartó para enfocarme en lo que mis otros proyectos no cubren (ADR-007)."
