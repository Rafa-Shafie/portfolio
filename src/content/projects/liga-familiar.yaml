# Liga Familiar Gamificada: projeto de estudo em andamento, redefinido para Postgres com volume e
# event sourcing (ADR-007), com o event sourcing justificado por medição (ADR-012). Repositório público.
# Status honesto: só a infraestrutura e as decisões de arquitetura (ADRs) existem; não há código de
# domínio nem nenhuma medição. A meta de latência é meta, não resultado. Sem demo ao vivo e sem link
# para os ADRs (ficam no repositório).
# Privacidade: sem os nomes dos membros da família.
title:
  pt: "Liga Familiar Gamificada"
  en: "Liga Familiar Gamificada"
  es: "Liga Familiar Gamificada"
description:
  pt: "Projeto de estudo que usa um gerenciador de tarefas domésticas como pretexto para aprender Postgres com grande volume de dados e event sourcing, e medir quando o event sourcing compensa."
  en: "A study project that uses a household chore manager as a pretext to learn Postgres at high data volume and event sourcing, and to measure when event sourcing pays off."
  es: "Proyecto de estudio que usa un gestor de tareas domésticas como pretexto para aprender Postgres con gran volumen de datos y event sourcing, y medir cuándo compensa el event sourcing."
category: backend
kind: personal
