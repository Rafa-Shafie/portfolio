# As 5 do cartão; Testcontainers e GitHub Actions (planejados) ficam no techDetails
stack:
  - Java 21
  - Spring Boot 4
  - PostgreSQL 18
  - Flyway
  - Docker Compose
details:
  intro:
    pt: "Cada tarefa doméstica concluída vai valer pontos, e os pontos serão eventos imutáveis. O domínio é simples de propósito: serve para estudar duas coisas que meus outros projetos não cobrem. A primeira é Postgres com volume: consultas analíticas, índices, rollups e views materializadas, a serem provados com medição antes e depois sobre milhões de eventos sintéticos. A segunda é event sourcing: o placar e as sequências serão projeções reconstruídas por replay, com snapshots e versionamento de eventos."
    en: "Each completed household chore will be worth points, and the points will be immutable events. The domain is simple on purpose: it exists to study two things my other projects do not cover. The first is Postgres at volume: analytical queries, indexes, rollups and materialized views, to be proven with before-and-after measurement over millions of synthetic events. The second is event sourcing: the scoreboard and the streaks will be projections rebuilt by replay, with snapshots and event versioning."
    es: "Cada tarea doméstica completada va a valer puntos, y los puntos serán eventos inmutables. El dominio es simple a propósito: sirve para estudiar dos cosas que mis otros proyectos no cubren. La primera es Postgres con volumen: consultas analíticas, índices, rollups y vistas materializadas, que se probarán con medición antes y después sobre millones de eventos sintéticos. La segunda es event sourcing: el marcador y las rachas serán proyecciones reconstruidas por replay, con snapshots y versionado de eventos."
  sections:
    - heading: { pt: "Como é construído", en: "How it is built", es: "Cómo se construye" }
      text:
        pt: "O domínio não exige event sourcing: uma tabela append-only com uma soma resolveria o placar. Por isso o projeto não tenta justificá-lo por argumento, e sim por medição. O mesmo placar será calculado por SQL direto, projeção incremental, replay completo, rollup e replay a partir de snapshot, em 100 mil, 1 milhão e 10 milhões de eventos. O relatório final vai responder quando cada forma compensa, e um ADR registra quando eu não usaria event sourcing. O desenvolvimento avança em fatias verticais, cada uma funcionando e testada antes da próxima, e cada decisão de arquitetura fica registrada em um ADR (Architecture Decision Record)."
        en: "The domain does not require event sourcing: an append-only table with a sum would solve the scoreboard. That is why the project does not try to justify it by argument, but by measurement. The same scoreboard will be calculated by plain SQL, incremental projection, full replay, rollup and replay from a snapshot, at 100 thousand, 1 million and 10 million events. The final report will answer when each approach pays off, and an ADR records when I would not use event sourcing. Development moves in vertical slices, each one working and tested before the next, and every architecture decision is recorded in an ADR (Architecture Decision Record)."
        es: "El dominio no exige event sourcing: una tabla append-only con una suma resolvería el marcador. Por eso el proyecto no intenta justificarlo con argumentos, sino con mediciones. El mismo marcador se calculará con SQL directo, proyección incremental, replay completo, rollup y replay a partir de un snapshot, con 100 mil, 1 millón y 10 millones de eventos. El informe final va a responder cuándo compensa cada forma, y un ADR registra cuándo no usaría event sourcing. El desarrollo avanza en vertical slices, cada una funcionando y probada antes de la siguiente, y cada decisión de arquitectura queda registrada en un ADR (Architecture Decision Record)."
    - heading: { pt: "Já implementado", en: "Already built", es: "Ya implementado" }
      items:
        pt:
          - "Ambiente reproduzível com Docker Compose: PostgreSQL 18 com versão fixada, volume persistente e healthcheck."
          - "Schema versionado com Flyway como único dono da estrutura; o Hibernate apenas valida o mapeamento."
          - "Configuração e segredos fora do código."
          - "12 ADRs, incluindo os que registram as mudanças de escopo e a justificativa do event sourcing."
        en:
          - "A reproducible environment with Docker Compose: PostgreSQL 18 with a pinned version, a persistent volume and a healthcheck."
          - "A versioned schema with Flyway as the single owner of the structure; Hibernate only validates the mapping."
          - "Configuration and secrets kept out of the code."
          - "12 ADRs, including the ones that record the scope changes and the rationale for event sourcing."
        es:
          - "Entorno reproducible con Docker Compose: PostgreSQL 18 con versión fijada, volumen persistente y healthcheck."
          - "Schema versionado con Flyway como único dueño de la estructura; Hibernate solo valida el mapeo."
          - "Configuración y secretos fuera del código."
          - "12 ADRs, incluidos los que registran los cambios de alcance y la justificación del event sourcing."
    - heading: { pt: "Planejado (ainda não implementado)", en: "Planned (not built yet)", es: "Planificado (todavía no implementado)" }
      items:
        pt:
          - "Tabela de eventos imutável, garantida pelo próprio banco, com correção por estorno (nada é apagado ou editado)."
          - "Duas linhas do tempo por evento (quando aconteceu e quando o sistema soube), permitindo consultar o placar de uma data passada como era conhecido naquela data."
          - "Oito consultas analíticas medidas (window functions, CTEs, date_trunc com fuso, EXPLAIN ANALYZE) sobre 2 anos de dados sintéticos."
          - "Índices, rollups com @Scheduled e views materializadas."
          - "Replay, snapshots e versionamento de eventos."
          - "Comparação medida entre SQL direto e as formas de event sourcing."
          - "Testes de integração com Testcontainers e PostgreSQL real, e CI no GitHub Actions."
          - "Meta (não é resultado): p95 abaixo de 100 ms nas consultas por família com 10 milhões de eventos."
        en:
          - "An immutable events table, enforced by the database itself, with corrections made by reversal (nothing is deleted or edited)."
          - "Two timelines per event (when it happened and when the system learned about it), making it possible to query the scoreboard for a past date as it was known on that date."
          - "Eight measured analytical queries (window functions, CTEs, time-zone-aware date_trunc, EXPLAIN ANALYZE) over 2 years of synthetic data."
          - "Indexes, rollups with @Scheduled and materialized views."
          - "Replay, snapshots and event versioning."
          - "A measured comparison between plain SQL and the event sourcing approaches."
          - "Integration tests with Testcontainers and a real PostgreSQL, and CI on GitHub Actions."
          - "Target (not a result): p95 below 100 ms for per-family queries with 10 million events."
        es:
          - "Tabla de eventos inmutable, garantizada por la propia base de datos, con corrección mediante reversión (nada se borra ni se edita)."
          - "Dos líneas de tiempo por evento (cuándo ocurrió y cuándo lo supo el sistema), lo que permite consultar el marcador de una fecha pasada tal como se conocía en esa fecha."
          - "Ocho consultas analíticas medidas (window functions, CTEs, date_trunc con zona horaria, EXPLAIN ANALYZE) sobre 2 años de datos sintéticos."
          - "Índices, rollups con @Scheduled y vistas materializadas."
          - "Replay, snapshots y versionado de eventos."
          - "Comparación medida entre SQL directo y las formas de event sourcing."
          - "Pruebas de integración con Testcontainers y PostgreSQL real, y CI en GitHub Actions."
          - "Meta (no es un resultado): p95 por debajo de 100 ms en las consultas por familia con 10 millones de eventos."
    - heading: { pt: "Desafio até aqui", en: "Challenge so far", es: "Desafío hasta ahora" }
      text:
        pt: "Duas decisões de escopo marcaram o projeto antes de existir código de domínio. A primeira foi abandonar autenticação e multi-tenancy, que pratico em outros projetos, para focar no que nenhum outro cobre (ADR-007). A segunda foi admitir que o domínio não exige event sourcing e transformar isso no experimento: medir quando ele compensa em vez de afirmar que compensa (ADR-012)."
        en: "Two scope decisions shaped the project before any domain code existed. The first was dropping authentication and multi-tenancy, which I practice in other projects, to focus on what none of the others cover (ADR-007). The second was admitting that the domain does not require event sourcing and turning that into the experiment: measuring when it pays off instead of claiming that it does (ADR-012)."
        es: "Dos decisiones de alcance marcaron el proyecto antes de que existiera código de dominio. La primera fue abandonar la autenticación y el multi-tenancy, que practico en otros proyectos, para enfocarme en lo que ningún otro cubre (ADR-007). La segunda fue admitir que el dominio no exige event sourcing y convertir eso en el experimento: medir cuándo compensa en lugar de afirmar que compensa (ADR-012)."
