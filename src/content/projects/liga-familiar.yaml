# Liga Familiar Gamificada: projeto pessoal em andamento (fatia 1). Repositório público.
# Privacidade: sem os nomes dos membros da família.
title:
  pt: "Liga Familiar Gamificada"
  en: "Liga Familiar Gamificada"
  es: "Liga Familiar Gamificada"
description:
  pt: "Gerenciador de tarefas domésticas no estilo RPG: cada membro da família ganha pontos ao concluir tarefas e acompanha sua evolução num placar. Roda localmente no Wi-Fi da casa, sem custo."
  en: "An RPG-style household chore manager: each family member earns points for completed chores and follows their progress on a leaderboard. It runs locally on the home Wi-Fi, at no cost."
  es: "Gestor de tareas domésticas al estilo RPG: cada miembro de la familia gana puntos al completar tareas y sigue su evolución en un marcador. Funciona localmente en el Wi-Fi de la casa, sin costo."
category: backend
kind: personal
status: progress
