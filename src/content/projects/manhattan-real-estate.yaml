# Manhattan Real Estate: solução de dados para análise de imóveis em Manhattan, desenvolvida em
# dupla no Summer Job no BTG Pactual (nome do projeto confirmado pelo Rafael para uso público). Visão técnica; a experiência (trabalho em dupla, decisões, aprendizados) fica em
# src/content/experiences/btg-asset-management.yaml. Projeto do banco: sem código nem demo
# públicos, ferramenta de visualização generalizada, sem métricas (não houve medição).
title:
  pt: "Manhattan Real Estate"
  en: "Manhattan Real Estate"
  es: "Manhattan Real Estate"
description:
  pt: "Solução de dados que reúne anúncios de imóveis em Manhattan de fontes diferentes para facilitar comparações e destacar possíveis oportunidades, com pontuação, acompanhamento de mudanças, notificações e um dashboard interativo."
  en: "A data solution that brings together Manhattan property listings from different sources to make comparisons easier and highlight potential opportunities, with scoring, change tracking, notifications and an interactive dashboard."
  es: "Solución de datos que reúne anuncios de inmuebles en Manhattan de distintas fuentes para facilitar comparaciones y destacar posibles oportunidades, con puntuación, seguimiento de cambios, notificaciones y un dashboard interactivo."
category: data
kind: professional
organization: BTG Pactual
status: delivered
art: map
order: 1
featured: true
experience: btg-asset-management
stack:
  - Python
  - SQL
  - Apache Spark
  - Databricks
  - RabbitMQ
details:
  summary:
    problem:
      pt: "Pesquisar imóveis em Manhattan exigia consultar portais separados e comparar anúncios, características e preços à mão."
      en: "Researching real estate in Manhattan meant checking separate listing sites and comparing listings, features and prices by hand."
      es: "Investigar inmuebles en Manhattan exigía consultar portales por separado y comparar anuncios, características y precios a mano."
    role:
      pt: "Em dupla, reconstruímos boa parte do tratamento dos dados e criamos a camada analítica, as regras de pontuação e as notificações. O dashboard foi a minha parte mais individual."
      en: "Working in a pair, we rebuilt most of the data processing and created the analytics layer, the scoring rules and the notifications. The dashboard was my most individual part."
      es: "En pareja, reconstruimos buena parte del tratamiento de los datos y creamos la capa analítica, las reglas de puntuación y las notificaciones. El dashboard fue mi parte más individual."
    delivery:
      pt: "Uma base única dos anúncios em Databricks, com pontuação, acompanhamento de eventos, avisos no Microsoft Teams e um dashboard interativo."
      en: "A single listings base in Databricks, with scoring, event tracking, Microsoft Teams alerts and an interactive dashboard."
      es: "Una base única de anuncios en Databricks, con puntuación, seguimiento de eventos, avisos en Microsoft Teams y un dashboard interactivo."
    result:
      pt: "Apresentado em inglês a quem pediu o projeto, com retorno positivo. A validação foi por comparação manual; não acompanhei a evolução depois do estágio."
      en: "Presented in English to the person who requested the project, with positive feedback. Validation was done by manual comparison; I did not follow the project after the internship."
      es: "Presentado en inglés a quien pidió el proyecto, con una respuesta positiva. La validación fue por comparación manual; no seguí la evolución del proyecto después de la pasantía."
  intro:
    pt: "Visão técnica do Manhattan Real Estate, a solução de dados que desenvolvi em dupla no Summer Job no BTG Pactual. O projeto pertence ao banco, então não há código nem demonstração públicos."
    en: "A technical view of Manhattan Real Estate, the data solution I built in a pair during my Summer Job at BTG Pactual. The project belongs to the bank, so there is no public code or demo."
    es: "Visión técnica de Manhattan Real Estate, la solución de datos que desarrollé en pareja en el Summer Job en BTG Pactual. El proyecto pertenece al banco, por lo que no hay código ni demostración públicos."
  sections:
    - heading: { pt: "Por que existe", en: "Why it exists", es: "Por qué existe" }
      text:
        pt: "Pesquisar imóveis exigia consultar portais separadamente e comparar à mão preços, características e localização. A solução organiza essas informações em uma base comum, apoia a exploração dos anúncios e destaca eventos que merecem uma análise mais detalhada."
        en: "Researching properties meant checking portals one by one and comparing prices, features and locations by hand. The solution organizes this information into a common base, supports exploring the listings and highlights events that deserve a closer look."
        es: "Buscar inmuebles exigía consultar los portales por separado y comparar a mano precios, características y ubicación. La solución organiza esa información en una base común, apoya la exploración de los anuncios y destaca eventos que merecen un análisis más detallado."
    - heading: { pt: "Dados em três camadas", en: "Data in three layers", es: "Datos en tres capas" }
      diagram: manhattan-pipeline
      text:
        pt: "O processamento segue a arquitetura Medallion, em Databricks, com Apache Spark, Python e SQL, e Pandas em análises pontuais. A ingestão já existia; o trabalho se concentrou em reconstruir grande parte da camada prata e em criar a camada ouro e as saídas analíticas."
        en: "Processing follows the Medallion architecture in Databricks, with Apache Spark, Python and SQL, and Pandas for one-off analyses. Ingestion already existed; the work focused on rebuilding most of the silver layer and creating the gold layer and the analytical outputs."
        es: "El procesamiento sigue la arquitectura Medallion, en Databricks, con Apache Spark, Python y SQL, y Pandas en análisis puntuales. La ingesta ya existía; el trabajo se concentró en reconstruir gran parte de la capa plata y en crear la capa oro y las salidas analíticas."
      items:
        pt:
          - "Bronze: dados de origem recebidos das APIs dos portais, em JSON, com a ingestão passando por um ambiente AWS EC2."
          - "Prata: reestruturação das views, limpeza, seleção e conciliação das informações entre fontes."
          - "Ouro: tabelas refinadas e indicadores que alimentam o dashboard e as notificações."
        en:
          - "Bronze: source data received from the portals' APIs as JSON, with ingestion running through an AWS EC2 environment."
          - "Silver: restructured views, cleaning, selection and reconciliation of information across sources."
          - "Gold: refined tables and indicators that feed the dashboard and the notifications."
        es:
          - "Bronce: datos de origen recibidos de las APIs de los portales, en JSON, con la ingesta pasando por un entorno AWS EC2."
          - "Plata: reestructuración de las views, limpieza, selección y conciliación de la información entre fuentes."
          - "Oro: tablas refinadas e indicadores que alimentan el dashboard y las notificaciones."
    - heading: { pt: "Fontes e conciliação", en: "Sources and reconciliation", es: "Fuentes y conciliación" }
      text:
        pt: "Zillow e StreetEasy são usados como fontes complementares, o que exige tratar campos ausentes, endereços incompletos e características divergentes. Uma informação presente em só uma fonte completa o registro, divergências seguem uma regra de precedência e registros sem qualidade suficiente são descartados. Uma terceira fonte foi retirada depois de avaliada a sua contribuição para o recorte."
        en: "Zillow and StreetEasy are used as complementary sources, which means handling missing fields, incomplete addresses and conflicting features. Information found in only one source fills in the record, conflicts follow a precedence rule and records without enough quality are discarded. A third source was dropped after its contribution to the scope was evaluated."
        es: "Zillow y StreetEasy se usan como fuentes complementarias, lo que exige tratar campos ausentes, direcciones incompletas y características divergentes. Una información presente en una sola fuente completa el registro, las divergencias siguen una regla de precedencia y los registros sin calidad suficiente se descartan. Una tercera fuente se retiró tras evaluar su aporte al alcance."
    - heading: { pt: "Duas avaliações, finalidades diferentes", en: "Two scores, two purposes", es: "Dos evaluaciones, finalidades distintas" }
      text:
        pt: "Dois indicadores organizam a pesquisa, sem substituir a análise de cada anúncio:"
        en: "Two indicators organize the research, without replacing the analysis of each listing:"
        es: "Dos indicadores organizan la búsqueda, sin sustituir el análisis de cada anuncio:"
      items:
        pt:
          - "Confiança da correspondência: combina endereço, quartos, banheiros e preço para reconhecer o mesmo imóvel em fontes diferentes; casos específicos podem exigir conferência humana, inclusive pelas imagens dos anúncios."
          - "Pontuação de oportunidade: prioriza a exploração dos anúncios combinando o tempo em que o imóvel está anunciado e a comparação do seu preço por pé quadrado com a média do bairro."
        en:
          - "Match confidence: combines address, bedrooms, bathrooms and price to recognize the same property across sources; specific cases may need a human check, including the listings' photos."
          - "Opportunity score: prioritizes which listings to explore by combining how long the property has been listed with how its price per square foot compares with the neighborhood average."
        es:
          - "Confianza de la correspondencia: combina dirección, habitaciones, baños y precio para reconocer el mismo inmueble en fuentes distintas; algunos casos pueden requerir una revisión humana, incluso por las fotos de los anuncios."
          - "Puntuación de oportunidad: prioriza la exploración de los anuncios combinando el tiempo que el inmueble lleva anunciado y la comparación de su precio por pie cuadrado con el promedio del barrio."
    - heading: { pt: "Acompanhamento e notificações", en: "Tracking and notifications", es: "Seguimiento y notificaciones" }
      text:
        pt: "Registros anteriores permitem comparar o comportamento dos anúncios ao longo do tempo. Os eventos relevantes chegam ao Microsoft Teams, por um fluxo que usa os dados da camada ouro e tem Amazon EKS e RabbitMQ na infraestrutura:"
        en: "Previous records make it possible to compare how listings behave over time. Relevant events reach Microsoft Teams through a flow that uses gold-layer data, with Amazon EKS and RabbitMQ in its infrastructure:"
        es: "Los registros anteriores permiten comparar el comportamiento de los anuncios a lo largo del tiempo. Los eventos relevantes llegan a Microsoft Teams por un flujo que usa los datos de la capa oro, con Amazon EKS y RabbitMQ en la infraestructura:"
      items:
        pt:
          - "Novos imóveis com pontuação elevada."
          - "Preços e preços por pé quadrado abaixo das referências regionais."
          - "Diferenças de preço entre anúncios correspondentes em fontes distintas."
          - "Saída de um imóvel de uma das fontes."
          - "Reaparecimento de anúncios, comparado às informações anteriores."
        en:
          - "New properties with a high score."
          - "Prices and prices per square foot below regional benchmarks."
          - "Price differences between matching listings in different sources."
          - "A property leaving one of the sources."
          - "Listings that reappear, compared with their previous information."
        es:
          - "Nuevos inmuebles con puntuación elevada."
          - "Precios y precios por pie cuadrado por debajo de las referencias regionales."
          - "Diferencias de precio entre anuncios correspondientes en fuentes distintas."
          - "Salida de un inmueble de una de las fuentes."
          - "Reaparición de anuncios, comparada con su información anterior."
    - heading: { pt: "Dashboard", en: "Dashboard", es: "Dashboard" }
      text:
        pt: "Construí o dashboard em Databricks, inspirado no design de um dashboard que já existia e com vários recursos novos; depois, um colega o levou para a ferramenta de visualização própria do banco. A ideia é partir de uma visão geral e refinar a pesquisa até um anúncio específico:"
        en: "I built the dashboard in Databricks, drawing on the design of an existing dashboard and adding several new features; a colleague later carried it over to the bank's own visualization tool. The idea is to start from an overview and narrow the search down to a specific listing:"
        es: "Construí el dashboard en Databricks, inspirado en el diseño de un dashboard que ya existía y con varios recursos nuevos; después, un compañero lo llevó a la herramienta de visualización propia del banco. La idea es partir de una visión general y refinar la búsqueda hasta un anuncio específico:"
      items:
        pt:
          - "Filtros por tempo de anúncio, pontuação, preço por pé quadrado, desvio em relação à média regional e categoria do imóvel."
          - "Contagem de imóveis atualizada conforme as seleções."
          - "Gráfico da distribuição por bairros e informações regionais, como quantidade de anúncios e preço médio por pé quadrado."
          - "Mapa com a localização e as características dos imóveis."
          - "Tabela dos anúncios filtrados, com os principais atributos e links para os anúncios de origem."
          - "Filtros, gráfico e mapa conectados, mantendo a exploração consistente."
        en:
          - "Filters by time on market, score, price per square foot, deviation from the regional average and property category."
          - "A property count that updates with each selection."
          - "A chart of the distribution by neighborhood and regional information, such as the number of listings and the average price per square foot."
          - "A map with the properties' locations and features."
          - "A table of the filtered listings, with their main attributes and links to the original listings."
          - "Filters, chart and map connected to keep the exploration consistent."
        es:
          - "Filtros por tiempo de publicación, puntuación, precio por pie cuadrado, desvío respecto del promedio regional y categoría del inmueble."
          - "Conteo de inmuebles actualizado según las selecciones."
          - "Gráfico de la distribución por barrios e información regional, como cantidad de anuncios y precio promedio por pie cuadrado."
          - "Mapa con la ubicación y las características de los inmuebles."
          - "Tabla de los anuncios filtrados, con sus principales atributos y enlaces a los anuncios de origen."
          - "Filtros, gráfico y mapa conectados, para mantener la exploración consistente."
    - heading: { pt: "Entrega e validação", en: "Delivery and validation", es: "Entrega y validación" }
      text:
        pt: "A entrega reuniu dados tratados, regras de análise, acompanhamento de eventos, notificações e um dashboard funcional, apresentados em inglês a quem pediu o projeto, com retorno positivo. A validação foi feita por inspeção e comparação manual dos registros e dos resultados. Não acompanhei a evolução do projeto depois do estágio."
        en: "The delivery brought together processed data, analysis rules, event tracking, notifications and a working dashboard, presented in English to the requester and well received. Validation was done by manually inspecting and comparing records and results. I did not follow the project after the internship ended."
        es: "La entrega reunió datos tratados, reglas de análisis, seguimiento de eventos, notificaciones y un dashboard funcional, presentados en inglés a quien solicitó el proyecto, con una recepción positiva. La validación se hizo mediante inspección y comparación manual de los registros y los resultados. No seguí la evolución del proyecto después de la pasantía."
