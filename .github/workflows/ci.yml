name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: astro check
        run: npm run check

      - name: build
        run: npm run build

      # Testes de ponta a ponta sobre o dist/ do passo anterior (astro preview + Chromium)
      - name: install Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npx playwright test

      # Nota mínima nas 3 rotas, mobile e desktop (scripts/check-lighthouse.mjs, Chromium do Playwright)
      - name: Lighthouse
        run: npm run lighthouse

      - name: upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: upload Lighthouse reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore
